<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocuBiz - Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0052D4, #4364F7, #6FB1FC);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8%;
    }

    .brand-section {
      flex: 1;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .brand-title {
      font-size: 5rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -1px;
    }

    .login-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 440px;
    }

    .login-card h2 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #1a202c;
      text-align: center;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: #4a5568;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      color: #2d3748;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrapper input:focus {
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.1);
    }

    .input-wrapper input::placeholder {
      color: #a0aec0;
    }

    .eye-toggle {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      cursor: pointer;
      color: #a0aec0;
      display: flex;
      align-items: center;
      padding: 0;
    }

    .eye-toggle:hover {
      color: #4a5568;
    }

    .forgot-link-wrapper {
      text-align: right;
      margin-top: 6px;
    }

    .forgot-link {
      font-size: 0.8rem;
      color: #2563eb;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #111827;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background: #1f2937;
    }

    .divider {
      text-align: center;
      margin: 18px 0;
      font-size: 0.85rem;
      color: #9ca3af;
      position: relative;
    }

    .divider::before, .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 42%;
      height: 1px;
      background: #e5e7eb;
    }

    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .btn-google {
      width: 100%;
      padding: 12px;
      background: #ffffff;
      color: #374151;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.90rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s;
    }

    .btn-google:hover {
      background: #f9fafb;
    }

    .google-icon {
      width: 18px;
      height: 18px;
    }

    .btn-admin {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.90rem;
      color: #374151;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    .btn-admin:hover {
      background: #f9fafb;
    }

    .signup-prompt {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #6b7280;
    }

    .signup-prompt a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }

    .signup-prompt a:hover {
      text-decoration: underline;
    }

    @media (max-width: 900px) {
      .container {
        flex-direction: column;
        justify-content: center;
        padding: 20px;
      }
      .brand-section {
        margin-bottom: 20px;
        text-align: center;
        justify-content: center;
      }
      .brand-title {
        font-size: 3rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand-section">
      <div class="brand-logo">
        <span class="brand-title">DocuBiz</span>
      </div>
    </div>
    <div class="login-card">
      <h2>Log In</h2>
      <form action="login.php" method="POST">
        <div class="form-group">
          <label for="email">Email or phone</label>
          <div class="input-wrapper">
            <input
              type="text"
              id="email"
              name="email"
              placeholder="email@gmail.com"
              required
            >
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              required
            >
            <button type="button" class="eye-toggle" title="Toggle password visibility">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <div class="forgot-link-wrapper">
            <a href="#" class="forgot-link">Forgot Password?</a>
          </div>
        </div>
        <button type="submit" class="btn-submit">Log In</button>
        <div class="divider">or</div>
        <button type="button" class="btn-google">
          <svg class="google-icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Log In with Google
        </button>
        <button type="button" class="btn-admin">
          Log In as Admin
        </button>
        <p class="signup-prompt">
          Don't have an account? <a href="signup.html">Create one</a>
        </p>
      </form>
    </div>
  </div>
  <script>
    const passwordInput = document.getElementById('password');
    const eyeToggle = document.querySelector('.eye-toggle');
    eyeToggle.addEventListener('click', function () {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
    });
  </script>
</body>
</html>
